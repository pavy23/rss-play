<!DOCTYPE html>

      #unity-container {

    <script>
      // ?ㅻ뵒???몃씫. Unity 濡쒕뜑蹂대떎 癒쇱? ?ㅽ뻾?섏뼱???쒕떎.
      //
      // 釉뚮씪?곗????ъ슜???쒖뒪泥??꾩뿉 留뚮뱾?댁쭊 AudioContext瑜?suspended濡??붾떎. 寃뚮떎媛
      // iOS Safari??WebAudio瑜?湲곌린??臾댁쓬 ?ㅼ쐞移섏뿉 醫낆냽?쒗궓????踰⑥냼由щ? 爰???
      // ?꾩씠?곗뿉????寃뚯엫??議곗슜??媛???뷀븳 ?댁쑀??
      (function () {
        // iOS 16.4+: ?ㅻ뵒???몄뀡??誘몃뵒???ъ깮?쇰줈 ?밴꺽?쒖폒 臾댁쓬 ?ㅼ쐞移섎? ?쇳븳??
        try {
          if (navigator.audioSession) navigator.audioSession.type = 'playback';
        } catch (e) { /* 吏?먰븯吏 ?딅뒗 釉뚮씪?곗???臾댁떆 */ }

        var Native = window.AudioContext || window.webkitAudioContext;
        if (!Native) return;
        var created = [];
        window.__audioContexts = created;   // 吏꾨떒??
        var Tracked = class extends Native {
          constructor() {
            super(...arguments);
            created.push(this);
          }
        };
        window.AudioContext = Tracked;
        if (window.webkitAudioContext) window.webkitAudioContext = Tracked;

        // Unity媛 ?먭린 而⑦뀓?ㅽ듃瑜??몄젣 源⑥슦?붿????섏〈?섏? ?딄퀬 吏곸젒 resume ?쒕떎.
        function wake() {
          for (var i = 0; i < created.length; i++) {
            var ctx = created[i];
            if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
          }
        }
        ['pointerdown', 'touchend', 'click', 'keydown'].forEach(function (name) {
          window.addEventListener(name, wake, { passive: true });
        });
      })();
    </script>

    <script>

      // alert()??釉뚮씪?곗?瑜?硫덉텛寃??섎?濡??붾㈃???쒖떆?쒕떎 ???곗뿉???먯씤???쎌쓣 ???덇쾶.

      //

      // ?ㅽ꺃?꾧? 諛붾뚮㈃ URL怨?productVersion???④퍡 諛붾뚯뼱 罹먯떆 ?ㅺ? 媛덈┛??
      var BUILD_STAMP = "20260803-1453";
      var v = "?v=" + BUILD_STAMP;
      var config = {

        dataUrl: buildUrl + "/Web.data.unityweb" + v,

      var NATIVE_W = 640, NATIVE_H = 360;

      // ?쎌? 諛?꾨? 1濡?怨좎젙???뚮뜑 ?寃잛씠 ?뺥솗??640x360???섍쾶 ?쒕떎. ?쎌??꾪듃??

      config.devicePixelRatio = 1;

      // 16:9瑜??좎??섎ŉ ?붾㈃ ?덉뿉 理쒕? 諛곗쑉濡??뺣??쒕떎. ?대뼡 ??鍮꾩쑉?먯꽌???섎━吏 ?딄퀬
      // ?⑤뒗 ?먮━???덊꽣諛뺤뒪媛 ?쒕떎.
      function fit() {
        var k = Math.min(window.innerWidth / NATIVE_W, window.innerHeight / NATIVE_H);
        canvas.style.transform = 'scale(' + k + ')';
