<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RSS">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#05070d">
    <title>Roguelike Scrolling Shooter</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      * { -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #05070d;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #cfe0ff;
        /* iOS Safari에서 페이지 자체가 스크롤/바운스되지 않게 */
        position: fixed; overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none;
      }
      /* 게임은 16:9 고정이므로 화면 중앙에 레터박스로 앉힌다 */
      #unity-container {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
      }
      #unity-canvas {
        display: block; background: #05070d; touch-action: none; outline: none;
        /* 레이아웃 크기는 게임의 네이티브 해상도로 고정한다. Unity는 이 값(clientWidth)을
           읽어 렌더 타겟과 Screen 크기를 잡으므로 Pixel Perfect Camera가 정확히 1배로
           동작한다. 화면을 채우는 일은 transform: scale이 맡는다 — transform은
           clientWidth를 바꾸지 않으므로 Unity 쪽 계산을 건드리지 않는다. */
        width: 640px; height: 360px;
        transform-origin: center center;
        image-rendering: pixelated;
      }

      #boot {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: #05070d; z-index: 20; text-align: center; padding: 24px;
      }
      #boot h1 {
        margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .18em;
        text-transform: uppercase; color: #7fa8ff;
      }
      #bar { width: min(280px, 70vw); height: 4px; background: #16202f; border-radius: 2px; overflow: hidden; }
      #bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #3d7bff, #7fd4ff); transition: width .2s; }
      .dim { color: #64789c; font-size: 12px; line-height: 1.6; margin: 0; }

      /* 세로 모드 안내 — 횡스크롤 슈팅이라 가로가 필수 */
      #rotate {
        position: absolute; inset: 0; display: none; z-index: 30;
        background: #05070d; align-items: center; justify-content: center;
        flex-direction: column; gap: 16px; text-align: center; padding: 32px;
      }
      #rotate svg { width: 54px; height: 54px; stroke: #7fa8ff; fill: none; stroke-width: 1.6; }
      @media (orientation: portrait) {
        body.mobile #rotate { display: flex; }
      }

      #err {
        position: absolute; left: 0; right: 0; bottom: 0; z-index: 40;
        display: none; padding: 12px 14px; background: #40121a;
        color: #ffc9d2; font-size: 11px; font-family: ui-monospace, monospace;
        white-space: pre-wrap; max-height: 45%; overflow: auto;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <div id="boot">
      <h1>Roguelike Scrolling Shooter</h1>
      <div id="bar"><i></i></div>
      <p class="dim" id="bootmsg">약 28MB를 내려받습니다 &middot; 와이파이 권장</p>
    </div>

    <div id="rotate">
      <svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2.5"/><path d="M9 19.5h6"/></svg>
      <p class="dim">가로로 돌려주세요<br>횡스크롤 슈팅이라 가로 화면이 필요합니다</p>
    </div>

    <div id="err"></div>

    <script>
      // 오디오 언락. Unity 로더보다 먼저 실행되어야 한다.
      //
      // 브라우저는 사용자 제스처 전에 만들어진 AudioContext를 suspended로 둔다. 게다가
      // iOS Safari는 WebAudio를 기기의 무음 스위치에 종속시킨다 — 벨소리를 꺼 둔
      // 아이폰에서 웹 게임이 조용한 가장 흔한 이유다.
      (function () {
        // iOS 16.4+: 오디오 세션을 미디어 재생으로 승격시켜 무음 스위치를 피한다.
        try {
          if (navigator.audioSession) navigator.audioSession.type = 'playback';
        } catch (e) { /* 지원하지 않는 브라우저는 무시 */ }

        var Native = window.AudioContext || window.webkitAudioContext;
        if (!Native) return;
        var created = [];
        window.__audioContexts = created;   // 진단용
        var Tracked = class extends Native {
          constructor() {
            super(...arguments);
            created.push(this);
          }
        };
        window.AudioContext = Tracked;
        if (window.webkitAudioContext) window.webkitAudioContext = Tracked;

        // Unity가 자기 컨텍스트를 언제 깨우는지에 의존하지 않고 직접 resume 한다.
        function wake() {
          for (var i = 0; i < created.length; i++) {
            var ctx = created[i];
            if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
          }
        }
        ['pointerdown', 'touchend', 'click', 'keydown'].forEach(function (name) {
          window.addEventListener(name, wake, { passive: true });
        });
      })();
    </script>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var boot = document.querySelector("#boot");
      var bar = document.querySelector("#bar > i");
      var bootmsg = document.querySelector("#bootmsg");
      var errBox = document.querySelector("#err");

      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
        || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isMobile) document.body.classList.add('mobile');

      // alert()는 브라우저를 멈추게 하므로 화면에 표시한다 — 폰에서 원인을 읽을 수 있게.
      function showError(msg) {
        errBox.style.display = 'block';
        errBox.textContent += msg + "\n";
      }
      function unityShowBanner(msg, type) {
        if (type === 'error') showError(msg);
      }
      window.addEventListener('error', function (e) {
        showError('JS: ' + (e.message || e.type));
      });

      var buildUrl = "Build";

      // 캐시 무효화 (2026-08-03). 이 줄이 없으면 배포해도 플레이어는 옛 빌드를 계속
      // 돌린다 — Unity WebGL 로더는 data/wasm을 **IndexedDB에 캐시**하고, 그 키가
      // (URL + productVersion)이라 둘 다 고정이면 새 파일을 아예 받지 않는다.
      // 실제로 여러 번 배포하고도 "여전히 그대로"라는 보고가 나왔고 원인이 이것이었다.
      //
      // BUILD_STAMP는 배포할 때마다 갱신한다 (Tools/deploy_web.ps1이 자동으로 바꾼다).
      // 스탬프가 바뀌면 URL과 productVersion이 함께 바뀌어 캐시 키가 갈린다.
      var BUILD_STAMP = "20260805-1449";
      var v = "?v=" + BUILD_STAMP;
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.unityweb" + v,
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb" + v,
        codeUrl: buildUrl + "/Web.wasm.unityweb" + v,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "pavy",
        productName: "Roguelike Scrolling Shooter",
        productVersion: BUILD_STAMP,
        showBanner: unityShowBanner,
      };

      // 게임의 네이티브 해상도. Pixel Perfect Camera의 참조 해상도와 같아야 한다.
      var NATIVE_W = 640, NATIVE_H = 360;
      canvas.width = NATIVE_W;
      canvas.height = NATIVE_H;
      // 픽셀 밀도를 1로 고정해 렌더 타겟이 정확히 640x360이 되게 한다. 픽셀아트라
      // 해상도를 올려도 얻는 게 없고, 폰에서는 프레임만 안정된다.
      config.devicePixelRatio = 1;

      // 16:9를 유지하며 화면 안에 최대 배율로 확대한다. 어떤 폰 비율에서도 잘리지 않고
      // 남는 자리는 레터박스가 된다.
      function fit() {
        var k = Math.min(window.innerWidth / NATIVE_W, window.innerHeight / NATIVE_H);
        canvas.style.transform = 'scale(' + k + ')';
      }
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
      fit();

      var script = document.createElement("script");
      script.src = buildUrl + "/Web.loader.js" + v;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          bar.style.width = (100 * progress) + "%";
          if (progress > 0.92) bootmsg.textContent = "압축 해제 중…";
        }).then(function (unityInstance) {
          boot.style.display = "none";
          window.unityInstance = unityInstance;
        }).catch(function (message) {
          bootmsg.textContent = "실행에 실패했습니다";
          showError(String(message));
        });
      };
      script.onerror = function () {
        bootmsg.textContent = "로더를 내려받지 못했습니다";
        showError("Failed to load " + script.src);
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
